<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Workout Split</title>
<style>
:root{--bg:#000;--card:#0a0f0c;--line:#17331f;--g:#0b6e3a;--g2:#1fa35c;--gt:#3fcf86;--text:#eef6f0;--mute:#7e9a86;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark;background:#000}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.main{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.main button{flex:1;padding:13px 6px;border:0;background:var(--card);color:var(--mute);font:600 15px inherit;font-family:inherit;cursor:pointer}
.main button.act{background:var(--g);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 15px inherit;font-family:inherit;cursor:pointer}
.tab.act{background:var(--g);color:#fff;border-color:var(--g2)}
.tab.c3{border-style:dashed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gt);outline-offset:2px}
.opt{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;color:var(--mute)}
.sw{width:46px;height:26px;border-radius:13px;background:#1a261e;border:0;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.2s}
.sw.on{background:var(--g2)}.sw.on::after{left:23px;background:#fff}
.bar{height:8px;background:#122017;border-radius:4px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--gt));transition:width .3s}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ex.done{border-color:var(--g2)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:650;font-size:17px}
.muscle{color:var(--gt);font-size:13px}
.rx{color:var(--mute);font-size:13px;white-space:nowrap;padding-top:3px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--mute);font:600 15px inherit;font-family:inherit;cursor:pointer}
.dot.on{background:var(--g);border-color:var(--g2);color:#fff}
.wt{margin-left:auto;width:84px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--text);font:16px inherit;font-family:inherit;text-align:center}
.btn{margin-top:8px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.pri{background:var(--g);border-color:var(--g2);color:#fff}
.btn.sm{width:auto;padding:8px 12px;margin:0;font-size:13px}
.note{color:var(--mute);font-size:13px;margin-top:14px}
.hd{font-size:18px;font-weight:650;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.cd{font-weight:650}
.li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-top:1px solid #0f2315}
.li span:last-child{color:var(--gt);text-align:right}
.hist{color:var(--mute);font-size:13px;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:10px}
textarea{width:100%;min-height:220px;background:#000;color:var(--text);border:1px solid var(--g2);border-radius:12px;padding:12px;font:14px/1.45 ui-monospace,Menlo,monospace;margin-top:10px}
.msg{color:var(--gt);font-size:13px;min-height:18px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Workout split</h1>
  <p class="sub">Two full-body days a week. Add a third when you're ready.</p>
  <div class="main"><button id="mw">Workout</button><button id="ml">Log</button></div>
  <div id="vw">
    <div class="tabs" id="tabs"></div>
    <div class="opt"><span>Add a 3rd day</span><button class="sw" id="sw" aria-label="Toggle third day"></button></div>
    <div class="prog"><span id="plabel"></span><span id="ptxt"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <div id="list" style="margin-top:14px"></div>
    <button class="btn pri" id="save">Save workout to log</button>
    <div class="msg" id="smsg"></div>
    <button class="btn" id="reset">Clear this day's checkmarks</button>
    <p class="note" id="note"></p>
  </div>
  <div id="vl" hidden>
    <button class="btn pri" id="expall" style="margin-top:0">Export all to a note</button>
    <div id="exbox" hidden>
      <textarea id="extxt" readonly aria-label="Exported workout note"></textarea>
      <div class="acts"><button class="btn pri sm" id="copy">Copy</button><button class="btn sm" id="closex">Close</button></div>
      <div class="msg" id="cmsg"></div>
    </div>
    <div class="hd">Weight tracker</div>
    <div id="wtl"></div>
    <div class="hd">Saved workouts</div>
    <div id="logl"></div>
  </div>
</div>
<script>
var DAYS={
A:{label:"Day A",note:"Stagger days: Mon / Thu. Rest 60-90 sec between sets, stop 1-2 reps before failure.",ex:[
 ["Incline Dumbbell Press","Upper chest",3,"8-12"],
 ["Lat Pulldown","Back",3,"8-12"],
 ["Shoulder Press","Shoulders",3,"8-12"],
 ["Curl","Biceps",3,"10-12"],
 ["Leg Extension","Quads",3,"10-15"],
 ["Full ROM Squats (ass to grass)","Legs",3,"10-15"],
 ["Leg Lifts (lying on ground)","Abs",3,"12-15"]]},
B:{label:"Day B",note:"Same muscles, different exercises. Add a little weight or a rep each week.",ex:[
 ["Pec Deck","Mid chest",3,"10-12"],
 ["Chest Supported Row","Back",3,"8-12"],
 ["Lateral Raises","Shoulders",3,"12-15"],
 ["Reverse Pec Deck","Rear delts",3,"12-15"],
 ["Tricep Pulldown","Triceps",3,"10-12"],
 ["Seated Leg Curl","Hamstrings",3,"10-12"],
 ["100 Crunches","Abs",1,"100"]]},
C:{label:"Day 3",note:"Optional lighter day. Keep it easy, 2 sets each, leave energy in the tank.",ex:[
 ["Incline Dumbbell Press","Upper chest",2,"10-12"],
 ["Chest Supported Row","Back",2,"10-12"],
 ["Lateral Raises","Shoulders",2,"12-15"],
 ["Reverse Pec Deck","Rear delts",2,"12-15"],
 ["Leg Extension","Quads",2,"12-15"],
 ["Seated Leg Curl","Hamstrings",2,"12-15"],
 ["Leg Lifts (lying on ground)","Abs",2,"12-15"]]}
};
var S={view:"w",day:"A",c3:false,done:{},wt:{},log:[]};
try{var s=JSON.parse(localStorage.getItem("wsplit")||"null");if(s){for(var k in s)S[k]=s[k];}}catch(e){}
if(!S.log)S.log=[];
function save(){try{localStorage.setItem("wsplit",JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i)}
function noWt(n){return n==="100 Crunches"||n.indexOf("Squats")>=0||n.indexOf("Leg Lifts")>=0;}
function fmtDate(iso){var d=new Date(iso);return d.toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function shortDate(iso){var d=new Date(iso);return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"});}
function entryText(e){
  var t=fmtDate(e.date)+" - "+e.day+"\n";
  e.items.forEach(function(it){t+=it.n+": "+(it.w?it.w+" - ":"")+it.d+"/"+it.t+" sets\n";});
  return t;
}
function setsDone(i,e){var m=(S.done[S.day]||{})[i]||[],c=0;for(var j=0;j<e[2];j++){if(m[j])c++;}return c;}

function renderWorkout(){
  if(!S.c3&&S.day==="C")S.day="A";
  var keys=S.c3?["A","B","C"]:["A","B"];
  $("tabs").innerHTML="";
  keys.forEach(function(k){
    var b=document.createElement("button");
    b.className="tab"+(k===S.day?" act":"")+(k==="C"?" c3":"");
    b.textContent=DAYS[k].label;
    b.onclick=function(){S.day=k;save();render();};
    $("tabs").appendChild(b);
  });
  $("sw").className="sw"+(S.c3?" on":"");
  var d=DAYS[S.day],dn=S.done[S.day]||(S.done[S.day]={});
  var total=0,got=0;
  $("list").innerHTML="";
  d.ex.forEach(function(e,i){
    var marks=dn[i]||[],c=setsDone(i,e);
    total+=e[2];got+=c;
    var card=document.createElement("div");
    card.className="ex"+(c===e[2]?" done":"");
    card.innerHTML='<div class="top"><div><div class="name">'+e[0]+'</div><div class="muscle">'+e[1]+'</div></div><div class="rx">'+e[2]+(e[2]>1?" sets":" set")+' &times; '+e[3]+'</div></div>';
    var row=document.createElement("div");row.className="row";
    for(var j=0;j<e[2];j++){(function(j){
      var b=document.createElement("button");
      b.className="dot"+(marks[j]?" on":"");
      b.textContent=e[2]===1?"Go":(j+1);
      b.setAttribute("aria-label","Set "+(j+1));
      b.onclick=function(){var m=dn[i]||(dn[i]=[]);m[j]=!m[j];save();render();};
      row.appendChild(b);})(j);}
    if(!noWt(e[0])){
      var w=document.createElement("input");
      w.className="wt";w.type="text";w.inputMode="decimal";w.placeholder="weight";
      w.value=S.wt[e[0]]||"";
      w.setAttribute("aria-label","Weight for "+e[0]);
      w.onchange=function(){S.wt[e[0]]=w.value;save();};
      row.appendChild(w);
    }
    card.appendChild(row);$("list").appendChild(card);
  });
  $("pbar").style.width=(total?Math.round(got/total*100):0)+"%";
  $("plabel").textContent=d.label;
  $("ptxt").textContent=got+" of "+total+" sets done";
  $("note").textContent=d.note;
}

function renderLog(){
  // weight tracker: history per exercise from saved workouts
  var hist={},order=[];
  S.log.slice().reverse().forEach(function(e){e.items.forEach(function(it){
    if(!it.w)return;
    if(!hist[it.n]){hist[it.n]=[];order.push(it.n);}
    hist[it.n].push({d:e.date,w:it.w});
  });});
  var wl=$("wtl");wl.innerHTML="";
  if(!order.length){wl.innerHTML='<div class="card" style="color:var(--mute);font-size:14px">No weights yet. Enter weights on the Workout tab, then save the workout.</div>';}
  order.forEach(function(n){
    var h=hist[n],card=document.createElement("div");card.className="card";
    var last=h[h.length-1],first=h[0];
    var trend=h.length>1?" ("+(parseFloat(last.w)-parseFloat(first.w)>=0?"+":"")+Math.round((parseFloat(last.w)-parseFloat(first.w))*100)/100+" since "+shortDate(first.d)+")":"";
    card.innerHTML='<div class="ctop"><span class="cd">'+n+'</span><span style="color:var(--gt)">'+last.w+'</span></div><div class="hist">'+h.map(function(x){return shortDate(x.d)+": "+x.w;}).join("  |  ")+trend+'</div>';
    wl.appendChild(card);
  });
  var ll=$("logl");ll.innerHTML="";
  if(!S.log.length){ll.innerHTML='<div class="card" style="color:var(--mute);font-size:14px">Nothing saved yet.</div>';}
  S.log.forEach(function(e,idx){
    var card=document.createElement("div");card.className="card";
    var top=document.createElement("div");top.className="ctop";
    top.innerHTML='<span class="cd">'+fmtDate(e.date)+' - '+e.day+'</span>';
    var acts=document.createElement("div");acts.style.display="flex";acts.style.gap="6px";
    var ex=document.createElement("button");ex.className="btn sm";ex.textContent="Export";
    ex.onclick=function(){showExport(entryText(e));};
    var del=document.createElement("button");del.className="btn sm";del.textContent="Delete";
    var armed=false,tm=null;
    del.onclick=function(){
      if(!armed){armed=true;del.textContent="Tap again";del.style.color="#ff6b6b";del.style.borderColor="#ff6b6b";
        tm=setTimeout(function(){armed=false;del.textContent="Delete";del.style.color="";del.style.borderColor="";},3000);return;}
      clearTimeout(tm);S.log.splice(idx,1);save();render();
    };
    acts.appendChild(ex);acts.appendChild(del);top.appendChild(acts);card.appendChild(top);
    e.items.forEach(function(it){
      var r=document.createElement("div");r.className="li";
      r.innerHTML='<span>'+it.n+'</span><span>'+(it.w?it.w+" - ":"")+it.d+'/'+it.t+' sets</span>';
      card.appendChild(r);
    });
    ll.appendChild(card);
  });
}

function showExport(text){
  $("extxt").value=text.replace(/\s+$/,"");
  $("exbox").hidden=false;$("cmsg").textContent="";
  $("exbox").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function render(){
  $("vw").hidden=S.view!=="w";$("vl").hidden=S.view!=="l";
  $("mw").className=S.view==="w"?"act":"";$("ml").className=S.view==="l"?"act":"";
  if(S.view==="w")renderWorkout();else renderLog();
}

$("mw").onclick=function(){S.view="w";save();render();};
$("ml").onclick=function(){S.view="l";save();render();};
$("sw").onclick=function(){S.c3=!S.c3;save();render();};
$("reset").onclick=function(){S.done[S.day]={};save();render();};
$("save").onclick=function(){
  var d=DAYS[S.day],items=[],any=false;
  d.ex.forEach(function(e,i){
    var c=setsDone(i,e);if(c>0)any=true;
    items.push({n:e[0],w:noWt(e[0])?"":(S.wt[e[0]]||""),d:c,t:e[2]});
  });
  if(!any){$("smsg").textContent="Check off at least one set first.";return;}
  S.log.unshift({date:new Date().toISOString(),day:d.label,items:items});
  S.done[S.day]={};save();
  $("smsg").textContent="Saved. Find it in the Log tab.";
  renderWorkout();
};
$("expall").onclick=function(){
  if(!S.log.length){showExport("No saved workouts yet.");return;}
  showExport("Workout log\n\n"+S.log.map(entryText).join("\n"));
};
$("closex").onclick=function(){$("exbox").hidden=true;};
$("copy").onclick=function(){
  var ta=$("extxt"),t=ta.value;
  function ok(){$("cmsg").textContent="Copied. Paste it into Notes.";}
  function fallback(){ta.removeAttribute("readonly");ta.focus();ta.select();ta.setSelectionRange(0,99999);
    try{document.execCommand("copy")?ok():($("cmsg").textContent="Text selected. Tap Copy in the menu.");}catch(e){$("cmsg").textContent="Text selected. Tap Copy in the menu.";}
    ta.setAttribute("readonly","");};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fallback);}else fallback();
};
render();
</script>
</body>
</html>
